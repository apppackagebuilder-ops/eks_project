# NGINX ingress demonstrates an alternative ingress controller often used for internal routing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-nginx
  namespace: platform-dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - internal.acme.dev.example.com
      secretName: internal-platform-tls
  rules:
    - host: internal.acme.dev.example.com
      http:
        paths:
          - path: /frontend
            pathType: Prefix
            backend:
              service:
                name: frontend-ui
                port:
                  number: 8080
