# Grafana dashboard JSON is stored in a ConfigMap so dashboards stay versioned in Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  platform-overview.json: |
    {
      "title": "Platform Overview",
      "schemaVersion": 39,
      "panels": [
        {"type": "timeseries", "title": "Requests", "targets": [{"expr": "sum(rate(http_server_requests_seconds_count[5m]))"}]},
        {"type": "timeseries", "title": "Errors", "targets": [{"expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m]))"}]},
        {"type": "timeseries", "title": "CPU Usage", "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"platform-.*\"}[5m]))"}]}
      ]
    }
