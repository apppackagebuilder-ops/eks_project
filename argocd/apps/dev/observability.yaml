# Development environment observability application using Helm charts with repo-stored values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-dev
  namespace: argocd
spec:
  project: platform-project
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 70.4.2
      helm:
        valueFiles:
          - $values/helm-values/observability/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/example/acme-eks-platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
