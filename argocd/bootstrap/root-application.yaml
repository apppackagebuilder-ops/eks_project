# The root application implements the App of Apps pattern for the development environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acme-platform-root
  namespace: argocd
spec:
  project: platform-project
  source:
    repoURL: https://github.com/example/acme-eks-platform.git
    targetRevision: HEAD
    path: argocd/apps/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
