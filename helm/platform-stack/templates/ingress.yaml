{{- range $name, $app := .Values.applications }}
{{- if and $app.enabled $app.ingress.enabled }}
---
# Ingress provides Layer 7 routing into the frontend service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  annotations:
{{- range $key, $value := $app.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
{{- end }}
spec:
  ingressClassName: {{ $app.ingress.className }}
  rules:
{{- range $host := $app.ingress.hosts }}
    - host: {{ $host.host }}
      http:
        paths:
{{- range $path := $host.paths }}
          - path: {{ $path.path }}
            pathType: {{ $path.pathType }}
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $app.service.port }}
{{- end }}
{{- end }}
{{- if $app.ingress.tls }}
  tls:
{{ toYaml $app.ingress.tls | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
