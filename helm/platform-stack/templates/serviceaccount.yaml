{{- range $name, $app := .Values.applications }}
{{- if $app.enabled }}
---
# Each workload receives a dedicated service account for least privilege and future IRSA bindings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
{{ include "platform-stack.labels" $ | indent 4 }}
{{- end }}
{{- end }}
