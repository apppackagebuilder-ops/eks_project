{{- range $name, $app := .Values.applications }}
{{- if and $app.enabled (eq $app.workloadType "Deployment") }}
---
# Deployments manage stateless or horizontally scalable workloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
{{ include "platform-stack.labels" $ | indent 4 }}
spec:
  replicas: {{ $app.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        environment: {{ $.Values.environment | quote }}
    spec:
      serviceAccountName: {{ $name }}
      containers:
        - name: {{ $name }}
          image: {{ $app.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $app.containerPort }}
          env:
{{- range $key, $value := $app.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
                optional: true
            - secretRef:
                name: {{ $name }}-secret
                optional: true
          resources:
{{ toYaml $app.resources | indent 12 }}
          livenessProbe:
            httpGet:
              path: {{ $app.probes.liveness.path }}
              port: {{ $app.containerPort }}
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ $app.probes.readiness.path }}
              port: {{ $app.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
{{- end }}
{{- end }}
