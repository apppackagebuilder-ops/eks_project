{{- range $name, $app := .Values.applications }}
{{- if and $app.enabled $app.secrets }}
---
# Secrets hold sensitive values that should later be sourced from an external secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secret
  namespace: {{ $.Values.namespace }}
type: Opaque
stringData:
{{- range $key, $value := $app.secrets }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- end }}
